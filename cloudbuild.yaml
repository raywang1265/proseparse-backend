# Build the spaCy analysis image from the api/ context, push it to Artifact
# Registry, and deploy to Cloud Run. Wired to a GitHub trigger (main branch).
substitutions:
  _REGION: us-central1
  _SERVICE: proseparse-analysis
  _REPO: proseparse

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - -f
      - api/Dockerfile
      - api

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      # --- free-tier-friendly sizing ---
      # 2Gi fits spaCy + CPU torch + all-MiniLM-L6-v2 in one image.
      - --memory=2Gi
      - --cpu=1
      - --min-instances=0       # scale to zero => no charge while idle (free tier)
      - --max-instances=10      # absorb the frontend's parallel batch fan-out
      # Inference is serialized by a lock, so an instance really handles 1 batch
      # at a time. Setting concurrency=1 makes Cloud Run scale OUT across instances
      # instead of packing requests onto a few and aborting the overflow.
      - --concurrency=1
      - --cpu-boost             # faster cold starts during burst scale-from-zero
      - --timeout=60
      - --allow-unauthenticated
      - --set-secrets=ANALYSIS_API_KEY=proseparse-analysis-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
